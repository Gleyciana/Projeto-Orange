name: CI - Cypress Tests

on:
  push:
    branches:
      - main  # Ou a branch que você usa para o desenvolvimento
  pull_request:
    branches:
      - main  # Ou a branch que você usa para o desenvolvimento

jobs:
  cypress-run:
    runs-on: ubuntu-20.04

    steps:
      # Etapa 1: Pegar o código
      - name: Checkout code
        uses: actions/checkout@v3

      # Etapa 2: Configurar Node.js e instalar dependências
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # Você pode escolher a versão de Node.js que seu projeto usa

      - name: Install dependencies
        run: npm install  # Instala as dependências do Cypress

      # Etapa 3: Rodar os testes do Cypress
      - name: Run Cypress Tests 🎯
        uses: cypress-io/github-action@v5
        with:
          start: ''  # Não precisa rodar um servidor, já que o sistema é remoto
          wait-on: ''  # Não precisa esperar por um URL se os testes forem rodar direto na aplicação
          record: false  # Deixe `false` para não gravar o teste, se não precisar disso

      # Etapa 4: Fazer o upload dos artefatos do Cypress (opcional)
      - name: Upload Cypress Results 📊
        uses: actions/upload-artifact@v3
        if: always()  # Garante que o upload seja feito mesmo que os testes falhem
        with:
          name: Cypress Result
          path: |
            cypress/screenshots
            cypress/videos
            cypress/results
          if-no-files-found: ignore
